# =============================================================================
#  AFFECTA — configuration nginx
#  Racine pointée sur public/ : aucun fichier applicatif n'est exposé.
# =============================================================================
upstream php-fpm {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8M;

    # Journaux
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Compression des réponses textuelles
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # En-têtes de sécurité (complément de ceux émis par l'application)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fichiers sensibles : jamais servis
    location ~ /\.(env|git|htaccess|dockerignore) { deny all; return 404; }
    location ~* \.(env|ini|log|sqlite|sql|md|json|lock)$ { deny all; return 404; }

    # Cache long pour les ressources statiques versionnées
    location ~* \.(css|js|woff2|woff|ttf|svg|png|jpe?g|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Aucun cache pour les pages dynamiques
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        include fastcgi_params;
    }

    # Interdit l'exécution de PHP dans les téléversements
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }
}
